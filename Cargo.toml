[package]
name = "hallmark"
version = "0.1.5"
edition = "2024"
rust-version = "1.88"
description = "A local, agent-first development loop: agents build, an independent reviewer approves, every step is recorded."
license = "MIT"
repository = "https://github.com/tiagocolombo/hallmark"
readme = "README.md"
keywords = ["claude", "agents", "code-review", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "plugin/**", "extensions/**", "assets/**", "build.rs", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "hall"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env", "string"] }
crossterm = "0.29.0"
dirs = "7.0.0"
dunce = "1.0.5"
fs4 = "1.1.0"
getrandom = "0.4.3"
globset = "0.4.20"
notify = "8.2.0"
notify-rust = "4.17.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = { version = "1.2.2", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
service-manager = "0.11.0"
shlex = "2.0.1"
toml = "1.1.8"
toml_edit = "0.25.17"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
wait-timeout = "0.2.1"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json", "redactions"] }
predicates = "3.1.4"
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
