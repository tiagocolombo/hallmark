[package]
name = "hallmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A local, agent-first development loop: agents build, an independent reviewer approves, every step is recorded."
license = "MIT"
repository = "https://github.com/tiagocolombo/hallmark"
readme = "README.md"
keywords = ["claude", "agents", "code-review", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "plugin/**", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "hall"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env", "string"] }
dirs = "7.0.0"
dunce = "1.0.5"
fs4 = "1.1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = { version = "1.2.2", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shlex = "2.0.1"
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json", "redactions"] }
predicates = "3.1.4"
tempfile = "3.27.0"
