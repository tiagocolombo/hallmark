name: Bug report
description: Something in hall doesn't work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please check the existing issues first.
        For a security issue, don't open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. hall new "..."
        2. hall ready
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: hall --version
      placeholder: hall 0.1.0 (1f1f859)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: hall doctor
      description: The output of `hall doctor`. Remove anything private.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Output or journal excerpt
      description: Relevant output, or events from `hall log <id>`. The journal contains your prompts, so remove anything private.
      render: text
