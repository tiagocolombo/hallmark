version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # release.yml is generated by dist: its pins live in dist-workspace.toml.
    exclude-paths:
      - .github/workflows/release.yml
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
