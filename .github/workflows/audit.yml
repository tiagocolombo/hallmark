name: Security audit

# Checks Cargo.lock against the RustSec advisory database: on every push to
# main, on pull requests that change dependencies, and daily for advisories
# published since. A failed scheduled run is the alert; Dependabot alerts
# cover the same advisories.
on:
  push:
    branches: [main]
  pull_request:
    paths: ["**/Cargo.toml", "**/Cargo.lock"]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - run: cargo audit
