name: Release-plz

# Versions come from conventional commits (ADR 0035). On every push to main,
# release-plz opens or refreshes the release PR (the next version, with its
# changelog); merging that PR tags vX.Y.Z, and the tag runs release.yml.
#
# Both jobs need RELEASE_PLZ_TOKEN: a fine-grained token, made by a
# repository admin, with contents and pull-requests write on this repository.
# The default GITHUB_TOKEN can't do the job:
# - the repository doesn't let GitHub Actions open pull requests;
# - a release PR it opened wouldn't run CI, so the required checks never pass;
# - the "Protect release tags" ruleset lets only admins create tags;
# - a tag it pushed wouldn't start release.yml.
# Without the secret, the jobs stop with an error that says so.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Tag a merged release PR
    if: ${{ github.repository_owner == 'tiagocolombo' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check for RELEASE_PLZ_TOKEN
        env:
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLZ_TOKEN" ]; then
            echo "::error title=RELEASE_PLZ_TOKEN is missing::Add a fine-grained token with contents and pull-requests write on this repository as the RELEASE_PLZ_TOKEN secret (ADR 0035)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - uses: release-plz/action@f393a7b38aca9d9b4c58447b291dbac963901df6 # v0.5.141
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-pr:
    name: Open the release PR
    if: ${{ github.repository_owner == 'tiagocolombo' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check for RELEASE_PLZ_TOKEN
        env:
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLZ_TOKEN" ]; then
            echo "::error title=RELEASE_PLZ_TOKEN is missing::Add a fine-grained token with contents and pull-requests write on this repository as the RELEASE_PLZ_TOKEN secret (ADR 0035)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - uses: release-plz/action@f393a7b38aca9d9b4c58447b291dbac963901df6 # v0.5.141
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
